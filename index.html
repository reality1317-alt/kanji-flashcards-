<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>確認問題 第8回 (21-40)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題 第8回（21〜40）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {num:21, before:'絵を', target:'ガク', after:'に入れて<ruby>飾<rt>かざ</rt></ruby>る。', beforeRuby:'絵を', afterRuby:'に入れて<ruby>飾<rt>かざ</rt></ruby>る。', kanji:'額', reading:'ガク（音読み）'},
  {num:22, before:'彼が<ruby>犯人<rt>はんにん</rt></ruby>だという', target:'カッコ', after:'たる<ruby>証拠<rt>しょうこ</rt></ruby>がある。', beforeRuby:'彼が<ruby>犯人<rt>はんにん</rt></ruby>だという', afterRuby:'たる<ruby>証拠<rt>しょうこ</rt></ruby>がある。', kanji:'確固', reading:'カッコ（音読み）'},
  {num:23, before:'', target:'カイゲン', after:'<ruby>供養<rt>くよう</rt></ruby>とは、<ruby>仏像<rt>ぶつぞう</rt></ruby>や<ruby>仏画<rt>ぶつが</rt></ruby>に<ruby>魂<rt>たましい</rt></ruby>を入れる<ruby>儀式<rt>ぎしき</rt></ruby>のことである。', beforeRuby:'', afterRuby:'<ruby>供養<rt>くよう</rt></ruby>とは、<ruby>仏像<rt>ぶつぞう</rt></ruby>や<ruby>仏画<rt>ぶつが</rt></ruby>に<ruby>魂<rt>たましい</rt></ruby>を入れる<ruby>儀式<rt>ぎしき</rt></ruby>のことである。', kanji:'開眼', reading:'カイゲン（音読み）'},
  {num:24, before:'<ruby>初詣<rt>はつもうで</rt></ruby>に行き、<ruby>息子<rt>むすこ</rt></ruby>の', target:'ゴウカク', after:'を<ruby>祈<rt>いの</rt></ruby>る。', beforeRuby:'<ruby>初詣<rt>はつもうで</rt></ruby>に行き、<ruby>息子<rt>むすこ</rt></ruby>の', afterRuby:'を<ruby>祈<rt>いの</rt></ruby>る。', kanji:'合格', reading:'ゴウカク（音読み）'},
  {num:25, before:'', target:'ゲネツ', after:'<ruby>剤<rt>ざい</rt></ruby>が<ruby>効<rt>き</rt></ruby>いて、ねつが下がる。', beforeRuby:'', afterRuby:'<ruby>剤<rt>ざい</rt></ruby>が<ruby>効<rt>き</rt></ruby>いて、ねつが下がる。', kanji:'解熱', reading:'ゲネツ（音読み）'},
  {num:26, before:'落とした<ruby>財布<rt>さいふ</rt></ruby>を<ruby>血<rt>ち</rt></ruby>', target:'まなこ', after:'になってさがす。', beforeRuby:'落とした<ruby>財布<rt>さいふ</rt></ruby>を<ruby>血<rt>ち</rt></ruby>', afterRuby:'になってさがす。', kanji:'眼', reading:'まなこ（訓読み）'},
  {num:27, before:'自らの', target:'あやまち', after:'を<ruby>認<rt>みと</rt></ruby>めて<ruby>謝罪<rt>しゃざい</rt></ruby>する。', beforeRuby:'自らの', afterRuby:'を<ruby>認<rt>みと</rt></ruby>めて<ruby>謝罪<rt>しゃざい</rt></ruby>する。', kanji:'過ち', reading:'あやまち（訓読み）'},
  {num:28, before:'子どもの<ruby>入場料<rt>にゅうじょうりょう</rt></ruby>は、大人の', target:'ハンガク', after:'だ。', beforeRuby:'子どもの<ruby>入場料<rt>にゅうじょうりょう</rt></ruby>は、大人の', afterRuby:'だ。', kanji:'半額', reading:'ハンガク（音読み）'},
  {num:29, before:'太い木の', target:'みき', after:'をくりぬいて、カヌーをつくる。', beforeRuby:'太い木の', afterRuby:'をくりぬいて、カヌーをつくる。', kanji:'幹', reading:'みき（訓読み）'},
  {num:30, before:'', target:'ひたい', after:'を<ruby>器具<rt>きぐ</rt></ruby>に近づけて<ruby>検温<rt>けんおん</rt></ruby>する。', beforeRuby:'', afterRuby:'を<ruby>器具<rt>きぐ</rt></ruby>に近づけて<ruby>検温<rt>けんおん</rt></ruby>する。', kanji:'額', reading:'ひたい（訓読み）'},
  {num:31, before:'', target:'ひんぱん', after:'に<ruby>腕時計<rt>うでどけい</rt></ruby>を見て<ruby>時刻<rt>じこく</rt></ruby>をたしかめる。', beforeRuby:'', afterRuby:'に<ruby>腕時計<rt>うでどけい</rt></ruby>を見て<ruby>時刻<rt>じこく</rt></ruby>をたしかめる。', kanji:'頻繁', reading:'ひんぱん（音読み）'},
  {num:32, before:'<ruby>私<rt>わたし</rt></ruby>は母と<ruby>性<rt>せい</rt></ruby>', target:'カク', after:'が<ruby>似<rt>に</rt></ruby>ていて、のんびり屋だ。', beforeRuby:'<ruby>私<rt>わたし</rt></ruby>は母と<ruby>性<rt>せい</rt></ruby>', afterRuby:'が<ruby>似<rt>に</rt></ruby>ていて、のんびり屋だ。', kanji:'格', reading:'カク（音読み）'},
  {num:33, before:'<ruby>手術<rt>しゅじゅつ</rt></ruby>後、<ruby>彼女<rt>かのじょ</rt></ruby>は目に見えて', target:'カイホウ', after:'へ向かった。', beforeRuby:'<ruby>手術<rt>しゅじゅつ</rt></ruby>後、<ruby>彼女<rt>かのじょ</rt></ruby>は目に見えて', afterRuby:'へ向かった。', kanji:'快方', reading:'カイホウ（音読み）'},
  {num:34, before:'GW中は、家の中でのんびりと', target:'すごす', after:'。', beforeRuby:'GW中は、家の中でのんびりと', afterRuby:'。', kanji:'過ごす', reading:'すごす（訓読み）'},
  {num:35, before:'<ruby>彼<rt>かれ</rt></ruby>が<ruby>事件<rt>じけん</rt></ruby>のなぞをとく', target:'かぎ', after:'を<ruby>握<rt>にぎ</rt></ruby>っている。', beforeRuby:'<ruby>彼<rt>かれ</rt></ruby>が<ruby>事件<rt>じけん</rt></ruby>のなぞをとく', afterRuby:'を<ruby>握<rt>にぎ</rt></ruby>っている。', kanji:'鍵', reading:'かぎ（訓読み）'},
  {num:36, before:'春になると、小鳥の', target:'こころよい', after:'さえずりが聞こえる。', beforeRuby:'春になると、小鳥の', afterRuby:'さえずりが聞こえる。', kanji:'快い', reading:'こころよい（訓読み）'},
  {num:37, before:'父親が<ruby>配達<rt>はいたつ</rt></ruby>されたばかりの', target:'チョウカン', after:'を読んでいる。', beforeRuby:'父親が<ruby>配達<rt>はいたつ</rt></ruby>されたばかりの', afterRuby:'を読んでいる。', kanji:'朝刊', reading:'チョウカン（音読み）'},
  {num:38, before:'', target:'カコ', after:'と<ruby>未来<rt>みらい</rt></ruby>を行き来するタイムマシーン。', beforeRuby:'', afterRuby:'と<ruby>未来<rt>みらい</rt></ruby>を行き来するタイムマシーン。', kanji:'過去', reading:'カコ（音読み）'},
  {num:39, before:'スポーツマンの兄は、がっちりとした', target:'タイカク', after:'だ。', beforeRuby:'スポーツマンの兄は、がっちりとした', afterRuby:'だ。', kanji:'体格', reading:'タイカク（音読み）'},
  {num:40, before:'<ruby>送別会<rt>そうべつかい</rt></ruby>の', target:'カンジ', after:'を<ruby>任<rt>まか</rt></ruby>されたので、計画を立てる。', beforeRuby:'<ruby>送別会<rt>そうべつかい</rt></ruby>の', afterRuby:'を<ruby>任<rt>まか</rt></ruby>されたので、計画を立てる。', kanji:'幹事', reading:'カンジ（音読み）'}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
