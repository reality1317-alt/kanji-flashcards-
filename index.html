<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>確認問題 第9回 (21-40)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題 第9回（21〜40）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {num:21, before:'リビングにある古時計は使われなくなって', target:'ひさしい', after:'。', beforeRuby:'リビングにある古時計は使われなくなって', afterRuby:'。', kanji:'久しい', reading:'ひさしい'},
  {num:22, before:'大学内の<ruby>若<rt>わか</rt></ruby>い研究者を<ruby>支援<rt>しえん</rt></ruby>する', target:'キキン', after:'が<ruby>設立<rt>せつりつ</rt></ruby>された。', beforeRuby:'大学内の<ruby>若<rt>わか</rt></ruby>い研究者を<ruby>支援<rt>しえん</rt></ruby>する', afterRuby:'が<ruby>設立<rt>せつりつ</rt></ruby>された。', kanji:'基金', reading:'キキン'},
  {num:23, before:'<ruby>保護者<rt>ほごしゃ</rt></ruby>は、<ruby>子供<rt>こども</rt></ruby>に', target:'ギ', after:'<ruby>務<rt>む</rt></ruby>教育を受けさせなければならない。', beforeRuby:'<ruby>保護者<rt>ほごしゃ</rt></ruby>は、<ruby>子供<rt>こども</rt></ruby>に', afterRuby:'<ruby>務<rt>む</rt></ruby>教育を受けさせなければならない。', kanji:'義', reading:'ギ（義務）'},
  {num:24, before:'<ruby>私<rt>わたし</rt></ruby>はソフトボールなどの', target:'キュウギ', after:'が苦手です。', beforeRuby:'<ruby>私<rt>わたし</rt></ruby>はソフトボールなどの', afterRuby:'が苦手です。', kanji:'球技', reading:'キュウギ'},
  {num:25, before:'', target:'キシュク', after:'<ruby>舎<rt>しゃ</rt></ruby>の<ruby>設備<rt>せつび</rt></ruby>がある中学校を<ruby>受験<rt>じゅけん</rt></ruby>する。', beforeRuby:'', afterRuby:'<ruby>舎<rt>しゃ</rt></ruby>の<ruby>設備<rt>せつび</rt></ruby>がある中学校を<ruby>受験<rt>じゅけん</rt></ruby>する。', kanji:'寄宿', reading:'キシュク'},
  {num:26, before:'先生の<ruby>指示<rt>しじ</rt></ruby>に', target:'さからう', after:'生徒はいなかった。', beforeRuby:'先生の<ruby>指示<rt>しじ</rt></ruby>に', afterRuby:'生徒はいなかった。', kanji:'逆らう', reading:'さからう'},
  {num:27, before:'「おくのほそ道」は<ruby>松尾芭蕉<rt>まつおばしょう</rt></ruby>が東北や<ruby>北陸<rt>ほくりく</rt></ruby>を旅した', target:'キコウ', after:'文だ。', beforeRuby:'「おくのほそ道」は<ruby>松尾芭蕉<rt>まつおばしょう</rt></ruby>が東北や<ruby>北陸<rt>ほくりく</rt></ruby>を旅した', afterRuby:'文だ。', kanji:'紀行', reading:'キコウ'},
  {num:28, before:'父親の<ruby>経験<rt>けいけん</rt></ruby>に', target:'もとづく', after:'意見を<ruby>尊重<rt>そんちょう</rt></ruby>する。', beforeRuby:'父親の<ruby>経験<rt>けいけん</rt></ruby>に', afterRuby:'意見を<ruby>尊重<rt>そんちょう</rt></ruby>する。', kanji:'基づく', reading:'もとづく'},
  {num:29, before:'', target:'キュウライ', after:'の<ruby>常識<rt>じょうしき</rt></ruby>をくつがえす新たな<ruby>手法<rt>しゅほう</rt></ruby>を開発する。', beforeRuby:'', afterRuby:'の<ruby>常識<rt>じょうしき</rt></ruby>をくつがえす新たな<ruby>手法<rt>しゅほう</rt></ruby>を開発する。', kanji:'旧来', reading:'キュウライ'},
  {num:30, before:'', target:'キ', after:'<ruby>則<rt>そく</rt></ruby>正しい食事をとる。', beforeRuby:'', afterRuby:'<ruby>則<rt>そく</rt></ruby>正しい食事をとる。', kanji:'規', reading:'キ（規則）'},
  {num:31, before:'マラソン<ruby>選手<rt>せんしゅ</rt></ruby>の', target:'ジキュウ', after:'<ruby>力<rt>りょく</rt></ruby>には<ruby>驚<rt>おどろ</rt></ruby>くべきものがある。', beforeRuby:'マラソン<ruby>選手<rt>せんしゅ</rt></ruby>の', afterRuby:'<ruby>力<rt>りょく</rt></ruby>には<ruby>驚<rt>おどろ</rt></ruby>くべきものがある。', kanji:'持久', reading:'ジキュウ'},
  {num:32, before:'たいていの', target:'ジョウギ', after:'には、ミリメートルの<ruby>目盛<rt>めも</rt></ruby>りがついている。', beforeRuby:'たいていの', afterRuby:'には、ミリメートルの<ruby>目盛<rt>めも</rt></ruby>りがついている。', kanji:'定規', reading:'ジョウギ'},
  {num:33, before:'私の', target:'トクギ', after:'は、歌を歌いながらバイオリンを<ruby>弾<rt>ひ</rt></ruby>くことだ。', beforeRuby:'私の', afterRuby:'は、歌を歌いながらバイオリンを<ruby>弾<rt>ひ</rt></ruby>くことだ。', kanji:'特技', reading:'トクギ'},
  {num:34, before:'学校で学ぶ', target:'イギ', after:'とは何かを考える。', beforeRuby:'学校で学ぶ', afterRuby:'とは何かを考える。', kanji:'意義', reading:'イギ'},
  {num:35, before:'先生について、ピアノを', target:'キホン', after:'から習う。', beforeRuby:'先生について、ピアノを', afterRuby:'から習う。', kanji:'基本', reading:'キホン'},
  {num:36, before:'4対5の<ruby>延長<rt>えんちょう</rt></ruby>十回の<ruby>裏<rt>うら</rt></ruby>に', target:'ギャクテン', after:'ホームランを<ruby>打<rt>う</rt></ruby>った。', beforeRuby:'4対5の<ruby>延長<rt>えんちょう</rt></ruby>十回の<ruby>裏<rt>うら</rt></ruby>に', afterRuby:'ホームランを<ruby>打<rt>う</rt></ruby>った。', kanji:'逆転', reading:'ギャクテン'},
  {num:37, before:'若い人たちの<ruby>活躍<rt>かつやく</rt></ruby>で、', target:'シンキュウ', after:'の世代交代が進む。', beforeRuby:'若い人たちの<ruby>活躍<rt>かつやく</rt></ruby>で、', afterRuby:'の世代交代が進む。', kanji:'新旧', reading:'シンキュウ'},
  {num:38, before:'よほどうれしいことがあったのか、母は', target:'キショク', after:'<ruby>満面<rt>まんめん</rt></ruby>だ。', beforeRuby:'よほどうれしいことがあったのか、母は', afterRuby:'<ruby>満面<rt>まんめん</rt></ruby>だ。', kanji:'喜色', reading:'キショク'},
  {num:39, before:'', target:'キカク', after:'外で市場に<ruby>出荷<rt>しゅっか</rt></ruby>できない<ruby>野<rt>や</rt></ruby><ruby>菜<rt>さい</rt></ruby>を安く売る。', beforeRuby:'', afterRuby:'外で市場に<ruby>出荷<rt>しゅっか</rt></ruby>できない<ruby>野<rt>や</rt></ruby><ruby>菜<rt>さい</rt></ruby>を安く売る。', kanji:'規格', reading:'キカク'},
  {num:40, before:'長く<ruby>伸<rt>の</rt></ruby>ばしていた<ruby>髪<rt>かみ</rt></ruby>を', target:'ひさしぶり', after:'に短く切った。', beforeRuby:'長く<ruby>伸<rt>の</rt></ruby>ばしていた<ruby>髪<rt>かみ</rt></ruby>を', afterRuby:'に短く切った。', kanji:'久しぶり', reading:'ひさしぶり'}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
