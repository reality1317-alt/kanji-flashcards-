<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>確認問題 第6回 (1-20)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題 第6回（1〜20）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {"num": 1, "script": "kata", "before": "", "target": "コクエイ", "after": "の<ruby>施設<rt>しせつ</rt></ruby>を使って<ruby>試合<rt>しあい</rt></ruby>をする。", "beforeRuby": "", "afterRuby": "の<ruby>施設<rt>しせつ</rt></ruby>を使って<ruby>試合<rt>しあい</rt></ruby>をする。", "kanji": "国営", "reading": "こくえい"},
  {"num": 2, "script": "kata", "before": "都会から<ruby>田舎<rt>いなか</rt></ruby>に", "target": "イジュウ", "after": "する人が<ruby>増<rt>ふ</rt></ruby>えている。", "beforeRuby": "都会から<ruby>田舎<rt>いなか</rt></ruby>に", "afterRuby": "する人が<ruby>増<rt>ふ</rt></ruby>えている。", "kanji": "移住", "reading": "いじゅう"},
  {"num": 3, "script": "kata", "before": "<ruby>機械<rt>きかい</rt></ruby>のおかげで", "target": "ロウリョク", "after": "を<ruby>省<rt>はぶ</rt></ruby>くことができる。", "beforeRuby": "<ruby>機械<rt>きかい</rt></ruby>のおかげで", "afterRuby": "を<ruby>省<rt>はぶ</rt></ruby>くことができる。", "kanji": "労力", "reading": "ろうりょく"},
  {"num": 4, "script": "hira", "before": "今後も", "target": "すえながく", "after": "お<ruby>付<rt>つ</rt></ruby>き<ruby>合<rt>あ</rt></ruby>いください。", "beforeRuby": "今後も", "afterRuby": "お<ruby>付<rt>つ</rt></ruby>き<ruby>合<rt>あ</rt></ruby>いください。", "kanji": "末永く", "reading": "すえながく"},
  {"num": 5, "script": "kata", "before": "", "target": "ジエイタイ", "after": "が<ruby>災害<rt>さいがい</rt></ruby><ruby>派遣<rt>はけん</rt></ruby>に出動した。", "beforeRuby": "", "afterRuby": "が<ruby>災害<rt>さいがい</rt></ruby><ruby>派遣<rt>はけん</rt></ruby>に出動した。", "kanji": "自衛隊", "reading": "じえいたい"},
  {"num": 6, "script": "kata", "before": "中野さんの電話番号を<ruby>携帯<rt>けいたい</rt></ruby>に", "target": "トウロク", "after": "する。", "beforeRuby": "中野さんの電話番号を<ruby>携帯<rt>けいたい</rt></ruby>に", "afterRuby": "する。", "kanji": "登録", "reading": "とうろく"},
  {"num": 7, "script": "kata", "before": "<ruby>潮風<rt>しおかぜ</rt></ruby>が<ruby>鉄骨<rt>てっこつ</rt></ruby>の<ruby>錆<rt>さび</rt></ruby>の", "target": "ゲンイン", "after": "になる。", "beforeRuby": "<ruby>潮風<rt>しおかぜ</rt></ruby>が<ruby>鉄骨<rt>てっこつ</rt></ruby>の<ruby>錆<rt>さび</rt></ruby>の", "afterRuby": "になる。", "kanji": "原因", "reading": "げんいん"},
  {"num": 8, "script": "kata", "before": "<ruby>試合<rt>しあい</rt></ruby>に負けられないという思いが", "target": "ジュウアツ", "after": "となってのしかかる。", "beforeRuby": "<ruby>試合<rt>しあい</rt></ruby>に負けられないという思いが", "afterRuby": "となってのしかかる。", "kanji": "重圧", "reading": "じゅうあつ"},
  {"num": 9, "script": "kata", "before": "エミリーは日本に", "target": "エイジュウ", "after": "することに決めた。", "beforeRuby": "エミリーは日本に", "afterRuby": "することに決めた。", "kanji": "永住", "reading": "えいじゅう"},
  {"num": 10, "script": "hira", "before": "", "target": "やさしい", "after": "<ruby>英語<rt>えいご</rt></ruby>で書かれた本を読む。", "beforeRuby": "", "afterRuby": "<ruby>英語<rt>えいご</rt></ruby>で書かれた本を読む。", "kanji": "易しい", "reading": "やさしい"},
  {"num": 11, "script": "kata", "before": "<ruby>宮殿<rt>きゅうでん</rt></ruby>の前で行われる", "target": "エイヘイ", "after": "の交代式を見る。", "beforeRuby": "<ruby>宮殿<rt>きゅうでん</rt></ruby>の前で行われる", "afterRuby": "の交代式を見る。", "kanji": "衛兵", "reading": "えいへい"},
  {"num": 12, "script": "kata", "before": "<ruby>危<rt>あぶ</rt></ruby>ないので、池の", "target": "シュウイ", "after": "では遊ばないように。", "beforeRuby": "<ruby>危<rt>あぶ</rt></ruby>ないので、池の", "afterRuby": "では遊ばないように。", "kanji": "周囲", "reading": "しゅうい"},
  {"num": 13, "script": "kata", "before": "<ruby>試合<rt>しあい</rt></ruby>の", "target": "ハイイン", "after": "を考えて練習方法を<ruby>変<rt>か</rt></ruby>える。", "beforeRuby": "<ruby>試合<rt>しあい</rt></ruby>の", "afterRuby": "を考えて練習方法を<ruby>変<rt>か</rt></ruby>える。", "kanji": "敗因", "reading": "はいいん"},
  {"num": 14, "script": "hira", "before": "教室に入ってきた先生が<ruby>生徒<rt>せいと</rt></ruby>たちに", "target": "かこまれる", "after": "。", "beforeRuby": "教室に入ってきた先生が<ruby>生徒<rt>せいと</rt></ruby>たちに", "afterRuby": "。", "kanji": "囲まれる", "reading": "かこまれる"},
  {"num": 15, "script": "kata", "before": "子どもにもわかるように", "target": "ヘイイ", "after": "な言葉で話す。", "beforeRuby": "子どもにもわかるように", "afterRuby": "な言葉で話す。", "kanji": "平易", "reading": "へいい"},
  {"num": 16, "script": "kata", "before": "校長先生に<ruby>卒業<rt>そつぎょう</rt></ruby><ruby>記念品<rt>きねんひん</rt></ruby>の", "target": "モクロク", "after": "を<ruby>手渡<rt>てわた</rt></ruby>す。", "beforeRuby": "校長先生に<ruby>卒業<rt>そつぎょう</rt></ruby><ruby>記念品<rt>きねんひん</rt></ruby>の", "afterRuby": "を<ruby>手渡<rt>てわた</rt></ruby>す。", "kanji": "目録", "reading": "もくろく"},
  {"num": 17, "script": "kata", "before": "<ruby>結婚式<rt>けっこんしき</rt></ruby>に<ruby>参列<rt>さんれつ</rt></ruby>した人々の前で", "target": "エイエン", "after": "の<ruby>愛<rt>あい</rt></ruby>をちかう。", "beforeRuby": "<ruby>結婚式<rt>けっこんしき</rt></ruby>に<ruby>参列<rt>さんれつ</rt></ruby>した人々の前で", "afterRuby": "の<ruby>愛<rt>あい</rt></ruby>をちかう。", "kanji": "永遠", "reading": "えいえん"},
  {"num": 18, "script": "kata", "before": "", "target": "ケツアツ", "after": "が高いので、<ruby>塩分<rt>えんぶん</rt></ruby>を<ruby>控<rt>ひか</rt></ruby>えている。", "beforeRuby": "", "afterRuby": "が高いので、<ruby>塩分<rt>えんぶん</rt></ruby>を<ruby>控<rt>ひか</rt></ruby>えている。", "kanji": "血圧", "reading": "けつあつ"},
  {"num": 19, "script": "kata", "before": "<ruby>季節<rt>きせつ</rt></ruby>ごとに、山と里を", "target": "イドウ", "after": "する鳥たち。", "beforeRuby": "<ruby>季節<rt>きせつ</rt></ruby>ごとに、山と里を", "afterRuby": "する鳥たち。", "kanji": "移動", "reading": "いどう"},
  {"num": 20, "script": "kata", "before": "中学<ruby>入試<rt>にゅうし</rt></ruby>を", "target": "アンイ", "after": "に考えてはいけない。", "beforeRuby": "中学<ruby>入試<rt>にゅうし</rt></ruby>を", "afterRuby": "に考えてはいけない。", "kanji": "安易", "reading": "あんい"}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
