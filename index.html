<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>総合復習問題 第10回 (41-60)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .back-btn {
    background: #fff;
    color: #34495e;
    border: 2px solid #34495e;
    padding: 6px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: bold;
    margin-right: 12px;
  }
  .back-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>総合復習問題 第10回（41〜60）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const Q = (num, before, target, after, kanji) => {
  const hira = target.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 96));
  return { num, before, target, after, beforeRuby: before, afterRuby: after, kanji, reading: `${kanji}（${hira}）` };
};
const questions = [
  Q(41, `<ruby>叔母<rt>おば</rt></ruby>の`, 'いとなむ', `<ruby>山奥<rt>やまおく</rt></ruby>の<ruby>温泉宿<rt>おんせんやど</rt></ruby>で、一夏を<ruby>過<rt>す</rt></ruby>ごした。`, '営む'),
  Q(42, `ロシアから<ruby>招<rt>まね</rt></ruby>いたバレエ<ruby>団<rt>だん</rt></ruby>の`, 'コウエン', `は<ruby>大盛況<rt>だいせいきょう</rt></ruby>だった。`, '公演'),
  Q(43, `あまりにも身体があつくてだるいので、`, 'ゲネツ', `<ruby>剤<rt>ざい</rt></ruby>を服用した。`, '解熱'),
  Q(44, ``, 'セイギ', `感が強すぎるために人とぶつかることが多い。`, '正義'),
  Q(45, `こっそりと<ruby>敵<rt>てき</rt></ruby>の`, 'ホウイ', `をぬけだし、味方と連絡をつける。`, '包囲'),
  Q(46, `長雨で<ruby>収穫<rt>しゅうかく</rt></ruby>が<ruby>減<rt>へ</rt></ruby>り、<ruby>野菜<rt>やさい</rt></ruby>の`, 'あたい', `が<ruby>高騰<rt>こうとう</rt></ruby>している。`, '値'),
  Q(47, `母の形見の<ruby>指輪<rt>ゆびわ</rt></ruby>をなくし、`, 'ちまなこ', `になって<ruby>探<rt>さが</rt></ruby>した。`, '血眼'),
  Q(48, `十八<ruby>歳<rt>さい</rt></ruby>で親元を<ruby>離<rt>はな</rt></ruby>れ、<ruby>故郷<rt>こきょう</rt></ruby>を去ってから`, 'ひさしい', `。`, '久しい'),
  Q(49, `コンビニは、平日や休日に<ruby>関<rt>かか</rt></ruby>わらず年中`, 'エイギョウ', `している。`, '営業'),
  Q(50, `みんなの`, 'ハンノウ', `を見てから、自分の意見を<ruby>述<rt>の</rt></ruby>べる。`, '反応'),
  Q(51, `一度<ruby>犯<rt>おか</rt></ruby>した`, 'あやまち', `を二度とくり返さないようにする。`, '過ち'),
  Q(52, `<ruby>恵<rt>めぐ</rt></ruby>まれない子どものために、<ruby>児童福祉<rt>じどうふくし</rt></ruby>`, 'キキン', `が<ruby>設立<rt>せつりつ</rt></ruby>される。`, '基金'),
  Q(53, `地方の村によっては古い`, 'インシュウ', `が根強く<ruby>残<rt>のこ</rt></ruby>っている。`, '因習'),
  Q(54, `漢字`, 'かな', `<ruby>交<rt>ま</rt></ruby>じり文は、日本<ruby>独特<rt>どくとく</rt></ruby>のものだ。`, '仮名'),
  Q(55, `けやきの太い`, 'みき', `を利用してうすを作る。`, '幹'),
  Q(56, `「<ruby>海道記<rt>かいどうき</rt></ruby>」は、京都と<ruby>鎌倉<rt>かまくら</rt></ruby>を<ruby>往復<rt>おうふく</rt></ruby>した旅の`, 'キコウ', `文だ。`, '紀行'),
  Q(57, `事業の<ruby>拡大<rt>かくだい</rt></ruby>に<ruby>伴<rt>ともな</rt></ruby>い、本社を<ruby>大阪<rt>おおさか</rt></ruby>から東京に`, 'うつす', `ことにした。`, '移す'),
  Q(58, `<ruby>生徒<rt>せいと</rt></ruby>会長の<ruby>提案<rt>ていあん</rt></ruby>が、全校生徒の<ruby>投票<rt>とうひょう</rt></ruby>で`, 'カケツ', `された。`, '可決'),
  Q(59, `<ruby>緊張<rt>きんちょう</rt></ruby>で<ruby>汗<rt>あせ</rt></ruby>の<ruby>浮<rt>う</rt></ruby>かんだ`, 'ひたい', `をハンカチでぬぐう。`, '額'),
  Q(60, `自らの<ruby>経験<rt>けいけん</rt></ruby>と<ruby>実験結果<rt>じっけんけっか</rt></ruby>に`, 'もとづい', `て<ruby>推論<rt>すいろん</rt></ruby>をたてる。`, '基づい')
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav"><button class="back-btn" id="btnBack" ${current === 0 ? 'disabled' : ''}>← 前へ</button>${current + 1} / ${questions.length}</div>
  `;
  document.getElementById('btnBack').addEventListener('click', goBack);
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function goBack() {
  if (current <= 0) return;
  current--;
  results[current] = null;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="back-btn" id="backBtn">← 前へ</button><button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', goBack);
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
