<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>確認問題 (21-40)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題（21〜40）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {"num": 21, "script": "", "before": "<ruby>西高東低<rt>せいこうとうてい</rt></ruby>の<ruby>冬型<rt>ふゆがた</rt></ruby>の", "target": "キアツ", "after": "<ruby>配置<rt>はいち</rt></ruby>が強まる。", "beforeRuby": "<ruby>西高東低<rt>せいこうとうてい</rt></ruby>の<ruby>冬型<rt>ふゆがた</rt></ruby>の", "afterRuby": "<ruby>配置<rt>はいち</rt></ruby>が強まる。", "kanji": "気圧", "reading": "きあつ"},
  {"num": 22, "script": "", "before": "北海道で<ruby>乳牛<rt>にゅうぎゅう</rt></ruby>を育てる<ruby>牧場<rt>ぼくじょう</rt></ruby>を", "target": "いとなむ", "after": "。", "beforeRuby": "北海道で<ruby>乳牛<rt>にゅうぎゅう</rt></ruby>を育てる<ruby>牧場<rt>ぼくじょう</rt></ruby>を", "afterRuby": "。", "kanji": "営む", "reading": "営む（いとなむ）"},
  {"num": 23, "script": "", "before": "流行は、時代とともに", "target": "うつり", "after": "かわる。", "beforeRuby": "流行は、時代とともに", "afterRuby": "かわる。", "kanji": "移り", "reading": "移り変わる（うつりかわる）"},
  {"num": 24, "script": "", "before": "<ruby>喫煙<rt>きつえん</rt></ruby>とがんには", "target": "インガ", "after": "<ruby>関係<rt>かんけい</rt></ruby>があるそうだ。", "beforeRuby": "<ruby>喫煙<rt>きつえん</rt></ruby>とがんには", "afterRuby": "<ruby>関係<rt>かんけい</rt></ruby>があるそうだ。", "kanji": "因果", "reading": "因果（いんが）"},
  {"num": 25, "script": "", "before": "<ruby>演奏<rt>えんそう</rt></ruby>を", "target": "ロクオン", "after": "し、聞き返す。", "beforeRuby": "<ruby>演奏<rt>えんそう</rt></ruby>を", "afterRuby": "し、聞き返す。", "kanji": "録音", "reading": "録音（ろくおん）"},
  {"num": 26, "script": "", "before": "<ruby>敵<rt>てき</rt></ruby>の<ruby>軍隊<rt>ぐんたい</rt></ruby>が町を", "target": "ホウイ", "after": "する。", "beforeRuby": "<ruby>敵<rt>てき</rt></ruby>の<ruby>軍隊<rt>ぐんたい</rt></ruby>が町を", "afterRuby": "する。", "kanji": "包囲", "reading": "包囲（ほうい）"},
  {"num": 27, "script": "", "before": "", "target": "ロウドウ", "after": "に対する<ruby>賃金<rt>ちんぎん</rt></ruby>を<ruby>支払<rt>しはら</rt></ruby>う。", "beforeRuby": "", "afterRuby": "に対する<ruby>賃金<rt>ちんぎん</rt></ruby>を<ruby>支払<rt>しはら</rt></ruby>う。", "kanji": "労働", "reading": "労働（ろうどう）"},
  {"num": 28, "script": "", "before": "朝早くから", "target": "エイギョウ", "after": "している<ruby>食堂<rt>しょくどう</rt></ruby>。", "beforeRuby": "朝早くから", "afterRuby": "している<ruby>食堂<rt>しょくどう</rt></ruby>。", "kanji": "営業", "reading": "営業（えいぎょう）"},
  {"num": 29, "script": "", "before": "村の生活は古くからの", "target": "インシュウ", "after": "にしばられている。", "beforeRuby": "村の生活は古くからの", "afterRuby": "にしばられている。", "kanji": "因習", "reading": "因習（いんしゅう）"},
  {"num": 30, "script": "", "before": "練りに練った計画をいよいよ実行に", "target": "うつす", "after": "。", "beforeRuby": "練りに練った計画をいよいよ実行に", "afterRuby": "。", "kanji": "移す", "reading": "移す（うつす）"},
  {"num": 31, "script": "", "before": "シルクロードを通って、東西の", "target": "コウエキ", "after": "が行われた。", "beforeRuby": "シルクロードを通って、東西の", "afterRuby": "が行われた。", "kanji": "交易", "reading": "交易（こうえき）"},
  {"num": 32, "script": "", "before": "世界の", "target": "エイゾク", "after": "<ruby>的<rt>てき</rt></ruby>な平和のために活動する。", "beforeRuby": "世界の", "afterRuby": "<ruby>的<rt>てき</rt></ruby>な平和のために活動する。", "kanji": "永続", "reading": "永続（えいぞく）"},
  {"num": 33, "script": "", "before": "長年の", "target": "クロウ", "after": "が<ruby>報<rt>むく</rt></ruby>われて<ruby>表彰<rt>ひょうしょう</rt></ruby>される。", "beforeRuby": "長年の", "afterRuby": "が<ruby>報<rt>むく</rt></ruby>われて<ruby>表彰<rt>ひょうしょう</rt></ruby>される。", "kanji": "苦労", "reading": "苦労（くろう）"},
  {"num": 34, "script": "", "before": "身の回りを<ruby>清潔<rt>せいけつ</rt></ruby>にして", "target": "エイセイ", "after": "<ruby>状態<rt>じょうたい</rt></ruby>を<ruby>保<rt>たも</rt></ruby>つ。", "beforeRuby": "身の回りを<ruby>清潔<rt>せいけつ</rt></ruby>にして", "afterRuby": "<ruby>状態<rt>じょうたい</rt></ruby>を<ruby>保<rt>たも</rt></ruby>つ。", "kanji": "衛生", "reading": "衛生（えいせい）"},
  {"num": 35, "script": "", "before": "", "target": "アツリョク", "after": "<ruby>鍋<rt>なべ</rt></ruby>を使ってやわらかく<ruby>煮<rt>に</rt></ruby>る。", "beforeRuby": "", "afterRuby": "<ruby>鍋<rt>なべ</rt></ruby>を使ってやわらかく<ruby>煮<rt>に</rt></ruby>る。", "kanji": "圧力", "reading": "圧力（あつりょく）"},
  {"num": 36, "script": "", "before": "<ruby>祖父<rt>そふ</rt></ruby>の死後、<ruby>祖母<rt>そぼ</rt></ruby>は", "target": "シンロウ", "after": "が重なり、体調をくずしてしまった。", "beforeRuby": "<ruby>祖父<rt>そふ</rt></ruby>の死後、<ruby>祖母<rt>そぼ</rt></ruby>は", "afterRuby": "が重なり、体調をくずしてしまった。", "kanji": "心労", "reading": "心労（しんろう）"},
  {"num": 37, "script": "", "before": "父は<ruby>食品輸入<rt>しょくひんゆにゅう</rt></ruby>会社を<ruby>経<rt>けい</rt></ruby>", "target": "エイ", "after": "している。", "beforeRuby": "父は<ruby>食品輸入<rt>しょくひんゆにゅう</rt></ruby>会社を<ruby>経<rt>けい</rt></ruby>", "afterRuby": "している。", "kanji": "営", "reading": "経営（けいえい）"},
  {"num": 38, "script": "", "before": "落ち葉を集めて、みんなでたき火を", "target": "かこ", "after": "む。", "beforeRuby": "落ち葉を集めて、みんなでたき火を", "afterRuby": "む。", "kanji": "囲", "reading": "囲む（かこむ）"},
  {"num": 39, "script": "", "before": "マラソン大会で<ruby>自己<rt>じこ</rt></ruby>の", "target": "キロク", "after": "を<ruby>更新<rt>こうしん</rt></ruby>し、<ruby>優勝<rt>ゆうしょう</rt></ruby>した。", "beforeRuby": "マラソン大会で<ruby>自己<rt>じこ</rt></ruby>の", "afterRuby": "を<ruby>更新<rt>こうしん</rt></ruby>し、<ruby>優勝<rt>ゆうしょう</rt></ruby>した。", "kanji": "記録", "reading": "記録（きろく）"},
  {"num": 40, "script": "", "before": "<ruby>宇宙人<rt>うちゅうじん</rt></ruby>の<ruby>攻撃<rt>こうげき</rt></ruby>に<ruby>備<rt>そな</rt></ruby>え、地球<ruby>防<rt>ぼう</rt></ruby>", "target": "エイ", "after": "<ruby>隊<rt>たい</rt></ruby>がつくられた。", "beforeRuby": "<ruby>宇宙人<rt>うちゅうじん</rt></ruby>の<ruby>攻撃<rt>こうげき</rt></ruby>に<ruby>備<rt>そな</rt></ruby>え、地球<ruby>防<rt>ぼう</rt></ruby>", "afterRuby": "<ruby>隊<rt>たい</rt></ruby>がつくられた。", "kanji": "衛", "reading": "防衛（ぼうえい）"}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
