<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢字フラッシュカード（1〜20）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>漢字フラッシュカード（1〜20）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {"num": 1, "script": "katakana", "before": "レギュラーになれたがケガもした", "target": "ヒキ", "after": "こもごもの一年だった。", "beforeRuby": "レギュラーになれたがケガもした", "afterRuby": "こもごもの一年だった。", "kanji": "悲喜", "reading": "ヒキ"},
  {"num": 2, "script": "katakana", "before": "あなたの親切は", "target": "エイキュウ", "after": "に<ruby>忘<rt>わす</rt></ruby>れないでしょう。", "beforeRuby": "あなたの親切は", "afterRuby": "に<ruby>忘<rt>わす</rt></ruby>れないでしょう。", "kanji": "永久", "reading": "エイキュウ"},
  {"num": 3, "script": "katakana", "before": "学校<ruby>周辺<rt>しゅうへん</rt></ruby>の道路は、<ruby>時間帯<rt>じかんたい</rt></ruby>により車の通行が", "target": "キ", "after": "<ruby>制<rt>せい</rt></ruby>される。", "beforeRuby": "学校<ruby>周辺<rt>しゅうへん</rt></ruby>の道路は、<ruby>時間帯<rt>じかんたい</rt></ruby>により車の通行が", "afterRuby": "<ruby>制<rt>せい</rt></ruby>される。", "kanji": "規", "reading": "キ"},
  {"num": 4, "script": "katakana", "before": "アイスホッケーはカナダの", "target": "コクギ", "after": "だ。", "beforeRuby": "アイスホッケーはカナダの", "afterRuby": "だ。", "kanji": "国技", "reading": "コクギ"},
  {"num": 5, "script": "katakana", "before": "十八", "target": "セイキ", "after": "にイギリスで<ruby>産業革命<rt>さんぎょうかくめい</rt></ruby>が起こった。", "beforeRuby": "十八", "afterRuby": "にイギリスで<ruby>産業革命<rt>さんぎょうかくめい</rt></ruby>が起こった。", "kanji": "世紀", "reading": "セイキ"},
  {"num": 6, "script": "katakana", "before": "毎週のテストの<ruby>成績<rt>せいせき</rt></ruby>に", "target": "イッキ", "after": "<ruby>一憂<rt>いちゆう</rt></ruby>する。", "beforeRuby": "毎週のテストの<ruby>成績<rt>せいせき</rt></ruby>に", "afterRuby": "<ruby>一憂<rt>いちゆう</rt></ruby>する。", "kanji": "一喜", "reading": "イッキ"},
  {"num": 7, "script": "katakana", "before": "<ruby>沖縄県<rt>おきなわけん</rt></ruby>には、アメリカの<ruby>軍事<rt>ぐんじ</rt></ruby>", "target": "キチ", "after": "がある。", "beforeRuby": "<ruby>沖縄県<rt>おきなわけん</rt></ruby>には、アメリカの<ruby>軍事<rt>ぐんじ</rt></ruby>", "afterRuby": "がある。", "kanji": "基地", "reading": "キチ"},
  {"num": 8, "script": "hiragana", "before": "転校する友人に、クラス全員で", "target": "よせがき", "after": "を<ruby>贈<rt>おく</rt></ruby>った。", "beforeRuby": "転校する友人に、クラス全員で", "afterRuby": "を<ruby>贈<rt>おく</rt></ruby>った。", "kanji": "寄せ書き", "reading": "よせがき"},
  {"num": 9, "script": "katakana", "before": "かつての<ruby>最新機器<rt>さいしんきき</rt></ruby>も今となっては", "target": "キュウシキ", "after": "だ。", "beforeRuby": "かつての<ruby>最新機器<rt>さいしんきき</rt></ruby>も今となっては", "afterRuby": "だ。", "kanji": "旧式", "reading": "キュウシキ"},
  {"num": 10, "script": "katakana", "before": "お年玉でもらったお金を、アフリカの<ruby>難民支援団体<rt>なんみんしえんだんたい</rt></ruby>に", "target": "キフ", "after": "する。", "beforeRuby": "お年玉でもらったお金を、アフリカの<ruby>難民支援団体<rt>なんみんしえんだんたい</rt></ruby>に", "afterRuby": "する。", "kanji": "寄付", "reading": "キフ"},
  {"num": 11, "script": "hiragana", "before": "<ruby>孫<rt>まご</rt></ruby>の中学<ruby>合格<rt>ごうかく</rt></ruby>を", "target": "よろこ", "after": "ぶ。", "beforeRuby": "<ruby>孫<rt>まご</rt></ruby>の中学<ruby>合格<rt>ごうかく</rt></ruby>を", "afterRuby": "ぶ。", "kanji": "喜", "reading": "よろこ"},
  {"num": 12, "script": "katakana", "before": "血のつながりのない男親を", "target": "ギフ", "after": "という。", "beforeRuby": "血のつながりのない男親を", "afterRuby": "という。", "kanji": "義父", "reading": "ギフ"},
  {"num": 13, "script": "katakana", "before": "", "target": "ハンギャク", "after": "者たちが<ruby>武器<rt>ぶき</rt></ruby>を<ruby>捨<rt>す</rt></ruby>てて<ruby>降伏<rt>こうふく</rt></ruby>する。", "beforeRuby": "", "afterRuby": "者たちが<ruby>武器<rt>ぶき</rt></ruby>を<ruby>捨<rt>す</rt></ruby>てて<ruby>降伏<rt>こうふく</rt></ruby>する。", "kanji": "反逆", "reading": "ハンギャク"},
  {"num": 14, "script": "katakana", "before": "", "target": "フウキ", "after": "委員が、<ruby>服装<rt>ふくそう</rt></ruby>の<ruby>乱<rt>みだ</rt></ruby>れを注意する。", "beforeRuby": "", "afterRuby": "委員が、<ruby>服装<rt>ふくそう</rt></ruby>の<ruby>乱<rt>みだ</rt></ruby>れを注意する。", "kanji": "風紀", "reading": "フウキ"},
  {"num": 15, "script": "katakana", "before": "<ruby>同窓会<rt>どうそうかい</rt></ruby>で", "target": "キュウチ", "after": "の友人たちと交友を深める。", "beforeRuby": "<ruby>同窓会<rt>どうそうかい</rt></ruby>で", "afterRuby": "の友人たちと交友を深める。", "kanji": "旧知", "reading": "キュウチ"},
  {"num": 16, "script": "katakana", "before": "リトグラフという<ruby>版画<rt>はんが</rt></ruby>の", "target": "ギホウ", "after": "を学ぶ。", "beforeRuby": "リトグラフという<ruby>版画<rt>はんが</rt></ruby>の", "afterRuby": "を学ぶ。", "kanji": "技法", "reading": "ギホウ"},
  {"num": 17, "script": "hiragana", "before": "", "target": "さかだち", "after": "をして十メートル歩けるようになった。", "beforeRuby": "", "afterRuby": "をして十メートル歩けるようになった。", "kanji": "逆立ち", "reading": "さかだち"},
  {"num": 18, "script": "katakana", "before": "", "target": "キゲン", "after": "前の人々の<ruby>暮<rt>く</rt></ruby>らしを<ruby>伝<rt>つた</rt></ruby>える、縄文時代の<ruby>貴重<rt>きちょう</rt></ruby>な<ruby>遺跡<rt>いせき</rt></ruby>。", "beforeRuby": "", "afterRuby": "前の人々の<ruby>暮<rt>く</rt></ruby>らしを<ruby>伝<rt>つた</rt></ruby>える、縄文時代の<ruby>貴重<rt>きちょう</rt></ruby>な<ruby>遺跡<rt>いせき</rt></ruby>。", "kanji": "紀元", "reading": "キゲン"},
  {"num": 19, "script": "hiragana", "before": "学校帰りに本屋に", "target": "よりみち", "after": "をする。", "beforeRuby": "学校帰りに本屋に", "afterRuby": "をする。", "kanji": "寄り道", "reading": "よりみち"},
  {"num": 20, "script": "katakana", "before": "", "target": "セイギ", "after": "を<ruby>貫<rt>つらぬ</rt></ruby>こうとする気持ちを持つことが大切だ。", "beforeRuby": "", "afterRuby": "を<ruby>貫<rt>つらぬ</rt></ruby>こうとする気持ちを持つことが大切だ。", "kanji": "正義", "reading": "セイギ"}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
