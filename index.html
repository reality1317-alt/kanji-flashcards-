<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>確認問題 第7回 (1-20)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題 第7回（1〜20）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const questions = [
  {num:1, script:'hira', before:'風に<ruby>散<rt>ち</rt></ruby>る花びらで水面が', target:'さくらいろ', after:'に<ruby>染<rt>そ</rt></ruby>まる。',
   beforeRuby:'風に<ruby>散<rt>ち</rt></ruby>る花びらで水面が', afterRuby:'に<ruby>染<rt>そ</rt></ruby>まる。', kanji:'桜色', reading:'桜色（さくらいろ）'},
  {num:2, script:'kata', before:'町の中心部を流れる', target:'タイガ', after:'。',
   beforeRuby:'町の中心部を流れる', afterRuby:'。', kanji:'大河', reading:'大河（たいが）'},
  {num:3, script:'kata', before:'石油<ruby>危機<rt>きき</rt></ruby>で', target:'ブッカ', after:'が上がり、生活が苦しくなる。',
   beforeRuby:'石油<ruby>危機<rt>きき</rt></ruby>で', afterRuby:'が上がり、生活が苦しくなる。', kanji:'物価', reading:'物価（ぶっか）'},
  {num:4, script:'kata', before:'<ruby>呼<rt>よ</rt></ruby>び<ruby>鈴<rt>りん</rt></ruby>を鳴らしても', target:'オウトウ', after:'がなかった。',
   beforeRuby:'<ruby>呼<rt>よ</rt></ruby>び<ruby>鈴<rt>りん</rt></ruby>を鳴らしても', afterRuby:'がなかった。', kanji:'応答', reading:'応答（おうとう）'},
  {num:5, script:'kata', before:'たくさんの<ruby>人前<rt>ひとまえ</rt></ruby>で', target:'エンゼツ', after:'するのは<ruby>勇気<rt>ゆうき</rt></ruby>がいる。',
   beforeRuby:'たくさんの<ruby>人前<rt>ひとまえ</rt></ruby>で', afterRuby:'するのは<ruby>勇気<rt>ゆうき</rt></ruby>がいる。', kanji:'演説', reading:'演説（えんぜつ）'},
  {num:6, script:'kata', before:'先生の<ruby>許<rt>きょ</rt></ruby>', target:'カ', after:'を<ruby>得<rt>え</rt></ruby>て練習を休む。',
   beforeRuby:'先生の<ruby>許<rt>きょ</rt></ruby>', afterRuby:'を<ruby>得<rt>え</rt></ruby>て練習を休む。', kanji:'可', reading:'許可（きょか）'},
  {num:7, script:'kata', before:'洗たく<ruby>機<rt>き</rt></ruby>には', target:'エキタイ', after:'の<ruby>洗剤<rt>せんざい</rt></ruby>を使う。',
   beforeRuby:'洗たく<ruby>機<rt>き</rt></ruby>には', afterRuby:'の<ruby>洗剤<rt>せんざい</rt></ruby>を使う。', kanji:'液体', reading:'液体（えきたい）'},
  {num:8, script:'hira', before:'作文に', target:'かり', after:'の題名をつけて書き始める。',
   beforeRuby:'作文に', afterRuby:'の題名をつけて書き始める。', kanji:'仮', reading:'仮（かり）'},
  {num:9, script:'kata', before:'', target:'ムエキ', after:'な<ruby>抵抗<rt>ていこう</rt></ruby>をやめて<ruby>降参<rt>こうさん</rt></ruby>する。',
   beforeRuby:'', afterRuby:'な<ruby>抵抗<rt>ていこう</rt></ruby>をやめて<ruby>降参<rt>こうさん</rt></ruby>する。', kanji:'無益', reading:'無益（むえき）'},
  {num:10, script:'kata', before:'車の', target:'オウライ', after:'が<ruby>激<rt>はげ</rt></ruby>しい<ruby>幹線<rt>かんせん</rt></ruby>道路。',
   beforeRuby:'車の', afterRuby:'が<ruby>激<rt>はげ</rt></ruby>しい<ruby>幹線<rt>かんせん</rt></ruby>道路。', kanji:'往来', reading:'往来（おうらい）'},
  {num:11, script:'kata', before:'店じまいのため、商品を', target:'テイカ', after:'の<ruby>半額<rt>はんがく</rt></ruby>で売る。',
   beforeRuby:'店じまいのため、商品を', afterRuby:'の<ruby>半額<rt>はんがく</rt></ruby>で売る。', kanji:'定価', reading:'定価（ていか）'},
  {num:12, script:'kata', before:'', target:'カメン', after:'を<ruby>脱<rt>ぬ</rt></ruby>いで正体をあらわす。',
   beforeRuby:'', afterRuby:'を<ruby>脱<rt>ぬ</rt></ruby>いで正体をあらわす。', kanji:'仮面', reading:'仮面（かめん）'},
  {num:13, script:'kata', before:'後から<ruby>設定<rt>せってい</rt></ruby>を<ruby>変更<rt>へんこう</rt></ruby>することが', target:'カ', after:'<ruby>能<rt>のう</rt></ruby>である。',
   beforeRuby:'後から<ruby>設定<rt>せってい</rt></ruby>を<ruby>変更<rt>へんこう</rt></ruby>することが', afterRuby:'<ruby>能<rt>のう</rt></ruby>である。', kanji:'可', reading:'可能（かのう）'},
  {num:14, script:'kata', before:'<ruby>冷却剤<rt>れいきゃくざい</rt></ruby>として', target:'エキカ', after:'した<ruby>窒素<rt>ちっそ</rt></ruby>を用いる。',
   beforeRuby:'<ruby>冷却剤<rt>れいきゃくざい</rt></ruby>として', afterRuby:'した<ruby>窒素<rt>ちっそ</rt></ruby>を用いる。', kanji:'液化', reading:'液化（えきか）'},
  {num:15, script:'kata', before:'家から学校まで', target:'オウ', after:'<ruby>復<rt>ふく</rt></ruby>一時間かかる。',
   beforeRuby:'家から学校まで', afterRuby:'<ruby>復<rt>ふく</rt></ruby>一時間かかる。', kanji:'往', reading:'往復（おうふく）'},
  {num:16, script:'hira', before:'ライトアップされた', target:'よざくら', after:'を見物する。',
   beforeRuby:'ライトアップされた', afterRuby:'を見物する。', kanji:'夜桜', reading:'夜桜（よざくら）'},
  {num:17, script:'kata', before:'<ruby>消毒<rt>しょうどく</rt></ruby>し、<ruby>包帯<rt>ほうたい</rt></ruby>を<ruby>巻<rt>ま</rt></ruby>いてけがの', target:'オウキュウ', after:'<ruby>処置<rt>しょち</rt></ruby>をする。',
   beforeRuby:'<ruby>消毒<rt>しょうどく</rt></ruby>し、<ruby>包帯<rt>ほうたい</rt></ruby>を<ruby>巻<rt>ま</rt></ruby>いてけがの', afterRuby:'<ruby>処置<rt>しょち</rt></ruby>をする。', kanji:'応急', reading:'応急（おうきゅう）'},
  {num:18, script:'kata', before:'<ruby>隅田川<rt>すみだがわ</rt></ruby>の', target:'カコウ', after:'<ruby>付近<rt>ふきん</rt></ruby>の<ruby>三角州<rt>さんかくす</rt></ruby>を<ruby>埋<rt>う</rt></ruby>め<ruby>立<rt>た</rt></ruby>てる。',
   beforeRuby:'<ruby>隅田川<rt>すみだがわ</rt></ruby>の', afterRuby:'<ruby>付近<rt>ふきん</rt></ruby>の<ruby>三角州<rt>さんかくす</rt></ruby>を<ruby>埋<rt>う</rt></ruby>め<ruby>立<rt>た</rt></ruby>てる。', kanji:'河口', reading:'河口（かこう）'},
  {num:19, script:'kata', before:'コーチから', target:'ユウエキ', after:'な助言をもらった。',
   beforeRuby:'コーチから', afterRuby:'な助言をもらった。', kanji:'有益', reading:'有益（ゆうえき）'},
  {num:20, script:'kata', before:'ニューヨークで日本の<ruby>交響楽団<rt>こうきょうがくだん</rt></ruby>が', target:'コウエン', after:'を行う。',
   beforeRuby:'ニューヨークで日本の<ruby>交響楽団<rt>こうきょうがくだん</rt></ruby>が', afterRuby:'を行う。', kanji:'公演', reading:'公演（こうえん）'}
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
