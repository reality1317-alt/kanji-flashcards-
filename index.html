<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認問題 第7回 (21-40)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>確認問題 第7回（21〜40）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const R = (k, y) => `<ruby>${k}<rt>${y}</rt></ruby>`;
const questions = [
  { num: 21, script: 'katakana', before: '大雪で車が立ち', target: 'オウジョウ', after: 'する。',
    beforeRuby: '大雪で車が立ち', afterRuby: 'する。', kanji: '往生', reading: 'おうじょう' },
  { num: 22, script: 'hiragana',
    before: '百円の商品に、三割の' + R('利益','りえき') + 'を' + R('見込','みこ') + 'んで', target: 'あたい', after: 'を付ける。',
    beforeRuby: '百円の商品に、三割の' + R('利益','りえき') + 'を' + R('見込','みこ') + 'んで', afterRuby: 'を付ける。', kanji: '値', reading: 'あたい' },
  { num: 23, script: 'katakana', before: '先週から', target: 'ジョウエン', after: '中のミュージカルを見に行く。',
    beforeRuby: '先週から', afterRuby: '中のミュージカルを見に行く。', kanji: '上演', reading: 'じょうえん' },
  { num: 24, script: 'katakana', before: 'けが人の耳もとで呼びかけても', target: 'ハンノウ', after: 'がない。',
    beforeRuby: 'けが人の耳もとで呼びかけても', afterRuby: 'がない。', kanji: '反応', reading: 'はんのう' },
  { num: 25, script: 'hiragana',
    before: '漢字の名前に' + R('片','かた'), target: 'かな', after: 'で読み方を' + R('振','ふ') + 'る。',
    beforeRuby: '漢字の名前に' + R('片','かた'), afterRuby: 'で読み方を' + R('振','ふ') + 'る。', kanji: '仮名', reading: 'かな（片仮名）' },
  { num: 26, script: 'katakana',
    before: 'アイガモは' + R('稲','いね') + 'の' + R('害虫','がいちゅう') + 'を食べてくれる', target: 'エキチョウ', after: 'だ。',
    beforeRuby: 'アイガモは' + R('稲','いね') + 'の' + R('害虫','がいちゅう') + 'を食べてくれる', afterRuby: 'だ。', kanji: '益鳥', reading: 'えきちょう' },
  { num: 27, script: 'hiragana',
    before: '春の海岸で、ピンクいろをした', target: 'さくらがい', after: 'を拾う。',
    beforeRuby: '春の海岸で、ピンクいろをした', afterRuby: 'を拾う。', kanji: '桜貝', reading: 'さくらがい' },
  { num: 28, script: 'katakana',
    before: R('満場','まんじょう') + R('一致','いっち') + 'で' + R('議案','ぎあん') + 'を', target: 'カケツ', after: 'する。',
    beforeRuby: R('満場','まんじょう') + R('一致','いっち') + 'で' + R('議案','ぎあん') + 'を', afterRuby: 'する。', kanji: '可決', reading: 'かけつ' },
  { num: 29, script: 'katakana',
    before: R('私','わたし') + 'の', target: 'ケツエキ', after: R('型','がた') + 'はA型です。',
    beforeRuby: R('私','わたし') + 'の', afterRuby: R('型','がた') + 'はA型です。', kanji: '血液', reading: 'けつえき' },
  { num: 30, script: 'hiragana', before: '', target: 'かわら', after: 'でバーベキューをする。',
    beforeRuby: '', afterRuby: 'でバーベキューをする。', kanji: '河原', reading: 'かわら' },
  { num: 31, script: 'katakana',
    before: 'ベーブルースは', target: 'オウネン', after: 'の名野球' + R('選手','せんしゅ') + 'である。',
    beforeRuby: 'ベーブルースは', afterRuby: 'の名野球' + R('選手','せんしゅ') + 'である。', kanji: '往年', reading: 'おうねん' },
  { num: 32, script: 'hiragana',
    before: R('監督','かんとく') + 'の' + R('激励','げきれい') + 'に', target: 'こたえる', after: '。',
    beforeRuby: R('監督','かんとく') + 'の' + R('激励','げきれい') + 'に', afterRuby: '。', kanji: '応える', reading: 'こたえる' },
  { num: 33, script: 'katakana',
    before: 'IT事業に' + R('成功','せいこう') + 'して、' + R('莫大','ばくだい') + 'な', target: 'リエキ', after: 'をあげる。',
    beforeRuby: 'IT事業に' + R('成功','せいこう') + 'して、' + R('莫大','ばくだい') + 'な', afterRuby: 'をあげる。', kanji: '利益', reading: 'りえき' },
  { num: 34, script: 'katakana',
    before: '', target: 'コウカ', after: 'な' + R('宝石','ほうせき') + 'を身につけて、パーティーに' + R('参加','さんか') + 'する。',
    beforeRuby: '', afterRuby: 'な' + R('宝石','ほうせき') + 'を身につけて、パーティーに' + R('参加','さんか') + 'する。', kanji: '高価', reading: 'こうか' },
  { num: 35, script: 'katakana',
    before: '返品', target: 'フカ', after: 'の商品なので、' + R('慎重','しんちょう') + 'に' + R('選','えら') + 'ぼう。',
    beforeRuby: '返品', afterRuby: 'の商品なので、' + R('慎重','しんちょう') + 'に' + R('選','えら') + 'ぼう。', kanji: '不可', reading: 'ふか' },
  { num: 36, script: 'katakana',
    before: '計画通りに実行' + R('可能','かのう') + 'かどうか、運動会の予行', target: 'エンシュウ', after: 'を行う。',
    beforeRuby: '計画通りに実行' + R('可能','かのう') + 'かどうか、運動会の予行', afterRuby: 'を行う。', kanji: '演習', reading: 'えんしゅう' },
  { num: 37, script: 'katakana',
    before: R('課題解決','かだいかいけつ') + 'のために、', target: 'カセツ', after: 'を立てて' + R('実験','じっけん') + 'する。',
    beforeRuby: R('課題解決','かだいかいけつ') + 'のために、', afterRuby: 'を立てて' + R('実験','じっけん') + 'する。', kanji: '仮説', reading: 'かせつ' },
  { num: 38, script: 'katakana',
    before: '国' + R('破','やぶ') + 'れて', target: 'サンガ', after: 'ありというが、' + R('敗戦','はいせん') + 'の' + R('翌','よく') + R('春','しゅん') + 'も美しい花々が人々の目をなぐさめた。',
    beforeRuby: '国' + R('破','やぶ') + 'れて', afterRuby: 'ありというが、' + R('敗戦','はいせん') + 'の' + R('翌','よく') + R('春','しゅん') + 'も美しい花々が人々の目をなぐさめた。', kanji: '山河', reading: 'さんが' },
  { num: 39, script: 'katakana',
    before: R('胃','い'), target: 'エキ', after: 'の中にふくまれている' + R('酸','さん') + '。',
    beforeRuby: R('胃','い'), afterRuby: 'の中にふくまれている' + R('酸','さん') + '。', kanji: '液', reading: 'えき（胃液）' },
  { num: 40, script: 'katakana',
    before: '春の' + R('到来','とうらい') + 'を知らせる', target: 'さくらゼンセン', after: 'が日に日に北上する。',
    beforeRuby: '春の' + R('到来','とうらい') + 'を知らせる', afterRuby: 'が日に日に北上する。', kanji: '桜前線', reading: 'さくらぜんせん' }
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
