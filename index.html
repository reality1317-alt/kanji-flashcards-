<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢字テスト (1-20)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #fdf2f2 0%, #f7e8e8 100%);
    margin: 0;
    padding: 20px 10px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  #app, .progress, h1 {
    width: 100%;
  }
  h1 {
    color: #c0392b;
    font-size: 1.3rem;
    margin: 0 0 16px 0;
    text-align: center;
  }
  .progress {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 400px;
    margin: 0 auto 20px auto;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ccc;
  }
  .dot.current { border-color: #f1c40f; border-width: 3px; }
  .dot.correct { background: #2ecc71; border-color: #2ecc71; }
  .dot.incorrect { background: #e74c3c; border-color: #e74c3c; }

  .card-container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    perspective: 1200px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
    transform-style: preserve-3d;
    transition: transform 0.6s, height 0.2s;
    cursor: pointer;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    min-height: 260px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    text-align: center;
    overflow-wrap: break-word;
  }
  .face.back {
    transform: rotateY(180deg);
  }
  .qnum {
    position: absolute;
    top: 12px;
    left: 16px;
    color: #999;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .sentence {
    font-size: clamp(1rem, 5vw, 1.3rem);
    line-height: 2.3;
    color: #333;
    max-width: 100%;
  }
  .sentence ruby rt {
    font-size: 0.55em;
    color: #888;
  }
  .kana-box {
    display: inline-block;
    border: 2px solid #e74c3c;
    color: #e74c3c;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .kanji-box {
    display: inline-block;
    border: 2px solid #27ae60;
    color: #27ae60;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 0 2px;
    font-weight: bold;
  }
  .reading-label {
    margin-top: 14px;
    color: #27ae60;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 16px;
    color: #aaa;
    font-size: 0.8rem;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin: 20px auto 0 auto;
    max-width: 420px;
    width: 100%;
    justify-content: center;
  }
  .buttons button {
    flex: 1;
    max-width: 160px;
    padding: 12px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  .btn-correct { background: #2ecc71; }
  .btn-incorrect { background: #e74c3c; }
  .buttons button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav {
    margin-top: 18px;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
  .summary {
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 18px;
    text-align: center;
    margin: 0 auto;
  }
  .summary h2 { color: #c0392b; }
  .summary .score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #333;
    margin: 10px 0 20px 0;
  }
  .miss-list {
    text-align: left;
    margin: 0 0 20px 0;
    padding: 0;
    list-style: none;
  }
  .miss-list li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
  }
  .miss-list .num { color: #999; margin-right: 8px; }
  .miss-list .ans { color: #27ae60; font-weight: bold; }
  .restart-btn {
    background: #34495e;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  .all-correct { color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>漢字テスト（1〜20）</h1>
<div class="progress" id="progress"></div>

<div id="app"></div>

<script>
const rb = (k, y) => `<ruby>${k}<rt>${y}</rt></ruby>`;
const mk = (num, script, before, target, after, kanji, reading) =>
  ({ num, script, before, target, after, beforeRuby: before, afterRuby: after, kanji, reading });

const questions = [
  mk(1, 'katakana', '他人の' + rb('存在','そんざい') + 'など、全く', 'ガンチュウ', 'にない。', '眼中', 'がんちゅう'),
  mk(2, 'katakana', '', 'カンブ', 'の' + rb('勢力','せいりょく') + rb('争','あらそ') + 'いで' + rb('政党','せいとう') + 'が' + rb('分裂','ぶんれつ') + 'する。', '幹部', 'かんぶ'),
  mk(3, 'katakana', rb('雑誌','ざっし') + 'の', 'シンカン', 'が書店の店頭に' + rb('並','なら') + 'ぶ。', '新刊', 'しんかん'),
  mk(4, 'katakana', 'たき火による', 'カシツ', 'が' + rb('原因','げんいん') + 'で山火事になった。', '過失', 'かしつ'),
  mk(5, 'katakana', '', 'カンヨウ', rb('句','く') + 'やことわざをたくさん' + rb('覚','おぼ') + 'える。', '慣用', 'かんよう'),
  mk(6, 'katakana', '時代に合わなくなった', 'カンコウ', 'を' + rb('是正','ぜせい') + 'する。', '慣行', 'かんこう'),
  mk(7, 'katakana', '東京と' + rb('大阪','おおさか') + 'を' + rb('結','むす') + 'ぶ新しい', 'カンセン', '道路を' + rb('建設','けんせつ') + 'する。', '幹線', 'かんせん'),
  mk(8, 'katakana', '一年生のときに' + rb('比','くら') + 'べると、町田くんは', 'カクジツ', 'に' + rb('成長','せいちょう') + 'している。', '確実', 'かくじつ'),
  mk(9, 'katakana', '子ども会の集まりは十二時に', 'カイサン', 'した。', '解散', 'かいさん'),
  mk(10, 'katakana', rb('将来','しょうらい') + 'を見とおす', 'ガンリキ', '。', '眼力', 'がんりき'),
  mk(11, 'katakana', '', 'ケイカイ', 'な足取りで歩いて行く。', '軽快', 'けいかい'),
  mk(12, 'katakana', rb('彼','かれ') + 'の言葉を', 'ガクメン', 'どおりに受け取ってはいけない。', '額面', 'がくめん'),
  mk(13, 'katakana', '山田' + rb('選手','せんしゅ') + 'は', 'ジンカク', '者として知られている。', '人格', 'じんかく'),
  mk(14, 'katakana', rb('健康','けんこう') + 'を' + rb('維持','いじ') + 'するため、生活', 'シュウカン', 'を見直す。', '習慣', 'しゅうかん'),
  mk(15, 'katakana', '小学生向けの', 'ゲッカン', rb('雑誌','ざっし') + 'を定期' + rb('購読','こうどく') + 'する。', '月刊', 'げっかん'),
  mk(16, 'katakana', rb('参議院','さんぎいん') + rb('選挙','せんきょ') + 'の' + rb('投票','とうひょう') + rb('結果','けっか') + 'が', 'カクテイ', 'する。', '確定', 'かくてい'),
  mk(17, 'katakana', rb('政府','せいふ') + 'が', 'カンコウ', 'する' + rb('書籍','しょせき') + 'を' + rb('取','と') + 'り' + rb('扱','あつか') + 'っている本屋。', '刊行', 'かんこう'),
  mk(18, 'katakana', 'この' + rb('辺','あた') + 'りの地理には', 'フなれ', 'なので、' + rb('道案内','みちあんない') + 'を' + rb('頼','たの') + 'む。', '不慣れ', 'ふなれ'),
  mk(19, 'katakana', '問題がすべて', 'カイケツ', 'したので明るい顔をしている。', '解決', 'かいけつ'),
  mk(20, 'katakana', rb('市谷','いちがや') + 'さんの' + rb('説明','せつめい') + 'は', 'メイカイ', 'でわかりやすかった。', '明快', 'めいかい')
];

let current = 0;
let flipped = false;
let results = new Array(questions.length).fill(null);

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if (results[i] === 'correct') d.className += ' correct';
    else if (results[i] === 'incorrect') d.className += ' incorrect';
    if (i === current && results[i] === null) d.className += ' current';
    p.appendChild(d);
  });
}

function renderCard() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderSummary();
    return;
  }
  const q = questions[current];
  flipped = false;
  app.innerHTML = `
    <div class="card-container">
      <div class="card" id="card">
        <div class="face front">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.before}<span class="kana-box">${q.target}</span>${q.after}</div>
          <div class="hint">タップして答えを見る</div>
        </div>
        <div class="face back">
          <div class="qnum">${q.num}</div>
          <div class="sentence">${q.beforeRuby}<span class="kanji-box">${q.kanji}</span>${q.afterRuby}</div>
          <div class="reading-label">${q.reading}</div>
        </div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-correct" id="btnCorrect" disabled>正解</button>
      <button class="btn-incorrect" id="btnIncorrect" disabled>間違えた</button>
    </div>
    <div class="nav">${current + 1} / ${questions.length}</div>
  `;
  const card = document.getElementById('card');
  adjustCardHeight();
  card.addEventListener('click', () => {
    if (!flipped) {
      flipped = true;
      card.classList.add('flipped');
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
    }
  });
  document.getElementById('btnCorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('correct');
  });
  document.getElementById('btnIncorrect').addEventListener('click', (e) => {
    e.stopPropagation();
    mark('incorrect');
  });
  renderProgress();
}

function adjustCardHeight() {
  const card = document.getElementById('card');
  if (!card) return;
  const front = card.querySelector('.face.front');
  const back = card.querySelector('.face.back');
  if (!front || !back) return;
  const prevFrontH = front.style.height, prevBackH = back.style.height;
  front.style.height = 'auto';
  back.style.height = 'auto';
  const h = Math.max(front.scrollHeight, back.scrollHeight, 260);
  front.style.height = prevFrontH;
  back.style.height = prevBackH;
  card.style.height = h + 'px';
}

window.addEventListener('resize', adjustCardHeight);

function mark(result) {
  results[current] = result;
  current++;
  renderCard();
}

function renderSummary() {
  const app = document.getElementById('app');
  const missed = questions.filter((q, i) => results[i] === 'incorrect');
  const correctCount = results.filter(r => r === 'correct').length;
  let missHtml = '';
  if (missed.length === 0) {
    missHtml = '<p class="all-correct">全問正解！お見事です 🎉</p>';
  } else {
    missHtml = '<ul class="miss-list">' + missed.map(q =>
      `<li><span><span class="num">${q.num}.</span>${q.target}</span><span class="ans">${q.kanji}</span></li>`
    ).join('') + '</ul>';
  }
  app.innerHTML = `
    <div class="summary">
      <h2>結果</h2>
      <div class="score">${correctCount} / ${questions.length} 問正解</div>
      ${missHtml}
      <button class="restart-btn" id="restartBtn">もう一度</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('progress').innerHTML = '';
}

function restart() {
  current = 0;
  results = new Array(questions.length).fill(null);
  renderCard();
}

renderCard();
</script>

</body>
</html>
